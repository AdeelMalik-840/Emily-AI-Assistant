name: semantic-intent-core-pr-validation

on:
  pull_request:
    branches:
      - fix/brain-semantic-authority

permissions:
  contents: write

jobs:
  validate-core-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head for workflow context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create isolated temp checkout from frozen remote feature head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/brain-semantic-authority
          EXPECTED_BASE_SHA="$(git rev-parse origin/fix/brain-semantic-authority)"
          test -n "$EXPECTED_BASE_SHA"
          git worktree add /tmp/emily-semantic-core fix/brain-semantic-authority
          cd /tmp/emily-semantic-core
          test "$(git branch --show-current)" = "fix/brain-semantic-authority"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$EXPECTED_BASE_SHA" > /tmp/emily-semantic-base-sha

      - name: Apply guarded existing-Brain patch in temp checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/emily-semantic-core
          test "$(git rev-parse HEAD)" = "$(cat /tmp/emily-semantic-base-sha)"
          set +e
          output="$(node scripts/applyBrainSemanticIntentCoreSlice.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "$output" | grep -F "unexpected changed files after patch: src/brain/decisions/decidePostConfirmCustomerDm.js"
          fi
          test -f tests/cloud-dm-semantic-intent-shadow.test.mjs

          node <<'NODE'
          const fs = require('fs');
          const path = 'tests/cloud-dm-ownership-boundary.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldText = `[
          "turnScope",
          "targetId",
          "mutationIntent",
          "action",
          "factKind",
        ]`;
          const newText = `[
          "turnScope",
          "semanticIntent",
          "targetId",
          "mutationIntent",
          "action",
          "factKind",
        ]`;
          const count = source.split(oldText).length - 1;
          if (count !== 1) {
            throw new Error(`ownership schema characterization anchor count=${count}; refusing edit`);
          }
          source = source.replace(oldText, newText);
          fs.writeFileSync(path, source, 'utf8');
          NODE

          changed="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          test "$changed" = $'src/brain/decisions/decidePostConfirmCustomerDm.js\ntests/cloud-dm-ownership-boundary.test.mjs\ntests/cloud-dm-semantic-intent-shadow.test.mjs'
          git diff --check

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/emily-semantic-core
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Run targeted semantic-authority tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/emily-semantic-core
          openssl genrsa -out /tmp/emily-ci-firebase-key.pem 2048 >/dev/null 2>&1
          export FIREBASE_KEY="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.stringify({type:"service_account",project_id:"emily-ci-test",private_key_id:"ci",private_key:fs.readFileSync("/tmp/emily-ci-firebase-key.pem","utf8"),client_email:"ci@emily-ci-test.iam.gserviceaccount.com",client_id:"1",auth_uri:"https://accounts.google.com/o/oauth2/auth",token_uri:"https://oauth2.googleapis.com/token",auth_provider_x509_cert_url:"https://www.googleapis.com/oauth2/v1/certs",client_x509_cert_url:"https://www.googleapis.com/robot/v1/metadata/x509/ci%40emily-ci-test.iam.gserviceaccount.com"}))')"
          node --test \
            tests/shared-brain-semantic-intent-contract.test.mjs \
            tests/semantic-intent-shadow-boundary.test.mjs \
            tests/brain-semantic-authority-safety-boundary.test.mjs \
            tests/cloud-dm-semantic-intent-shadow.test.mjs \
            tests/cloud-dm-ownership-boundary.test.mjs

      - name: Verify no routing/executor files changed
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/emily-semantic-core
          changed="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          test "$changed" = $'src/brain/decisions/decidePostConfirmCustomerDm.js\ntests/cloud-dm-ownership-boundary.test.mjs\ntests/cloud-dm-semantic-intent-shadow.test.mjs'
          test -z "$(printf '%s\n' "$changed" | grep -E 'WorkflowEngine|UnderstandingEngine|whatsappInboundBuffer|inboundTurnLedger|executors|workflows/' || true)"
          git diff --stat

      - name: Commit tested candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/emily-semantic-core
          test "$(git rev-parse HEAD)" = "$(cat /tmp/emily-semantic-base-sha)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/brain/decisions/decidePostConfirmCustomerDm.js tests/cloud-dm-ownership-boundary.test.mjs tests/cloud-dm-semantic-intent-shadow.test.mjs
          git diff --cached --check
          git commit -m "refactor(brain): emit semantic intent in existing cloud ownership decision"
          git push --force-with-lease origin HEAD:refs/heads/candidate/semantic-intent-core-tested
